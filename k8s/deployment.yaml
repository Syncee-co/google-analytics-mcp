apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-deployment
  namespace: default
  labels:
    app: mcp-ga
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-ga
  template:
    metadata:
      labels:
        app: mcp-ga
    spec:
      serviceAccountName: default-ga
      containers:
        - name: mcp-ga-container
          image: europe-west4-docker.pkg.dev/syncee-cloud/syncee-docker/syncee-mcp-ga-master:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: syncee-ga-mcp-config
            - configMapRef:
                name: syncee-general-config
          volumeMounts:
            - name: secret
              mountPath: "/run/secret"
              readOnly: true
          ports:
            - containerPort: 80
          lifecycle:
            preStop:
              exec:
                command: [ "/bin/sh", "-c", "sleep 300" ]
          resources:
            limits:
              cpu: "500m"
              memory: "1024Mi"
            requests:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
      volumes:
        - name: secret
          secret:
            secretName: syncee-ga-mcp-secret